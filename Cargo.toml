[workspace]
members = [".", "apps/desktop/src-tauri"]
default-members = ["."]
resolver = "2"

[package]
name = "smart-vpn-engine"
version = "0.1.26"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "blocking", "json"] }
libc = "0.2"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
semver = "1"
minisign-verify = "0.2.5"

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1"
tar = "0.4"
tempfile = "3"
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_Networking_WinInet", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
