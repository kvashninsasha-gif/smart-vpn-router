name: Windows verification and installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'Cargo.*'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'locales/**'
      - 'apps/desktop/**'
      - 'scripts/download-core.py'
      - 'scripts/test-windows-proxy-guardian.py'
      - 'scripts/test-windows-installer-update.ps1'
      - 'scripts/test-core-startup.py'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LLAMA_STATIC_CRT: "1"
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate native AI build tools
        shell: pwsh
        run: |
          $clang = 'C:\Program Files\LLVM\bin'
          if (!(Test-Path "$clang\libclang.dll")) { throw 'LLVM libclang is required' }
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          cmake --version
      - name: Download and verify pinned Windows core
        run: python scripts/download-core.py --platform windows-amd64
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Rust tests with real local VLESS and core schema checks
        run: cargo test --locked --workspace
        env:
          SMARTVPN_TEST_CORE: ${{ github.workspace }}/core/sing-box.exe
      - name: Native proxy setup, restore, and forced parent death
        run: cargo test --locked -p smart-vpn-desktop windows_real_proxy_restore_and_parent_death -- --ignored --test-threads=1
        env:
          FOXVPN_TEST_ALLOW_SYSTEM_PROXY: "1"
      - name: Build public startup fixture generator
        run: cargo build --locked --release --example startup-fixtures
      - name: Frontend dependencies
        run: npm ci
        working-directory: apps/desktop
      - name: Frontend tests
        run: npm test
        working-directory: apps/desktop
      - name: Build Windows installer
        run: npm run tauri -- build --config src-tauri/tauri.windows.conf.json --bundles nsis
        working-directory: apps/desktop
      - name: Verify packaged release proxy guardian entry
        run: python scripts/test-windows-proxy-guardian.py target/release/smart-vpn-desktop.exe
        env:
          FOXVPN_TEST_ALLOW_SYSTEM_PROXY: "1"
      - name: Verify real NSIS update mode and profile preservation
        shell: pwsh
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*.exe).FullName
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          ./scripts/test-windows-installer-update.ps1 -Installer $installer -ExpectedVersion $version
        env:
          FOXVPN_TEST_ALLOW_INSTALLER: "1"
      - name: Record artifact checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*.exe
          if ($files.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: foxVPN-Windows-x64
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS.txt
            target/release/bundle/nsis/windows-core-startup.json
            target/release/bundle/nsis/windows-local-ai.json
